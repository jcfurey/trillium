image: node:22
stages:
  - install
  - build

cache:
  paths:
    - node_modules/
    - .yarn/cache/

before_script:
  - corepack enable

install_dependencies:
  stage: install
  script:
    - yarn install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

build_app:
  stage: build
  script:
    - yarn run web:build:prod