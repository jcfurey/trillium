name: NodeJS Webpack Github Pages

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        corepack enable
        yarn
        yarn web:build:prod

    # Serve the extension marketplace from the deployed site. The app fetches
    # the registry from the relative URL "extensions/registry.json"
    # (ExtensionMarketplaceProvider), and the JoyTeleop entry points at the
    # relative archive "extensions/joyteleop.foxe" — without this staging the
    # Pages deployment has no marketplace and no .foxe archive.
    - name: Build JoyTeleop extension and stage extension archive
      run: |
        (cd extensions/joyteleop && npm ci && npm run package)
        mkdir -p web/.webpack/extensions
        cp extensions/registry.json web/.webpack/extensions/registry.json
        cp extensions/joyteleop/*.foxe web/.webpack/extensions/joyteleop.foxe

    - name: Upload static files as artifact
      id: deployment
      uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
      with:
        path: web/.webpack/

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action
