name: NodeJS Webpack Github Pages

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        corepack enable
        yarn
        yarn web:build:prod

    # Assemble the extension bundle (marketplace registry + offline-mirrored
    # .foxe blobs + fleet-baked builtins) with the same script the container and
    # GitLab CI use, then stage it where the app serves it (/extensions/). Keeps
    # all three deploys in lockstep. jq/curl are preinstalled on ubuntu-latest.
    # Submodule-sourced extensions (e.g. the erdc_joystick joystick panel) are
    # not built here — their submodules aren't checked out on this runner — so
    # they're absent from the Pages marketplace and the script logs a warning
    # rather than failing.
    - name: Assemble extension bundle
      run: |
        bash extensions/build_extensions.sh
        cp -r extensions/release web/.webpack/extensions

    - name: Upload static files as artifact
      id: deployment
      uses: actions/upload-pages-artifact@v3 # or specific "vX.X.X" version tag for this action
      with:
        path: web/.webpack/

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # or specific "vX.X.X" version tag for this action
